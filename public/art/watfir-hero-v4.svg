<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 864 265" width="864" height="265" role="img" aria-labelledby="title desc">
<title id="title">Watfir — monument et rubans, d'après la maquette V4</title>
<desc id="desc">Deux rubans rouge et bleu se croisent en une courbe, encadrant une tour élancée sur une toiture basse et un pont à trois arches ouvertes.</desc>
<!-- SVG entièrement vectoriel ; fond transparent ; coordonnées de référence : art de la V4, largeur 864. -->
<g id="rubans">
  <!-- Le ruban cyan inférieur remonte derrière le rouge, exactement comme dans la référence. -->
  <path id="cyan-inferieur" fill="#02C5E7" d="M 49,242 H 430 C 467,242 473,221 489,199 L 512,184 C 488,232 472,263 433,263 H 38 Z"/>
  <!-- Ruban rouge : partie gauche horizontale, courbe ascendante, puis partie haute. -->
  <path id="rouge" fill="#F22421" d="M 56,219 H 430 C 474,219 492,175 520,138 C 545,106 564,102 590,102 H 832 V 125 H 590 C 560,125 543,145 519,179 C 489,219 475,242 431,242 H 43 Z"/>
  <!-- Ruban cyan supérieur, à pointe naissante à gauche et terminé derrière la tour. -->
  <path id="cyan-superieur" fill="#02C5E7" d="M 426,219 C 467,205 486,159 513,119 C 542,82 566,74 597,74 H 832 V 96 H 597 C 568,96 551,109 526,145 C 497,187 480,215 426,219 Z"/>
</g>
<g id="monument" fill="#F7E9C2">
  <!-- Toit et tour : une seule silhouette pour éviter les joints visibles à l'export. -->
  <path id="toit-et-tour" fill-rule="evenodd" d="M 532,197 L 546,187 H 576 L 593,178 H 654 V 124 L 660,119 L 665,104 L 674,100 L 677,63 L 671,56 L 675,43 L 680,3 L 685,43 L 691,56 L 685,63 L 687,100 L 696,104 L 702,119 L 706,124 V 178 H 768 L 780,168 L 812,197 Z M665,133 h7 v17 h-7 Z M680,133 h7 v17 h-7 Z M695,133 h7 v17 h-7 Z" />
  <path id="pont-trois-arches" d="M 469,262 C 474,234 487,214 521,207 C 532,206 539,206 547,206 H 826 V 262 H 806 C 806,237 791,223 763,223 C 736,223 720,239 720,262 H 698 C 698,237 682,223 654,223 C 628,223 610,238 610,262 H 588 C 588,237 571,223 544,223 C 519,223 500,239 500,262 Z" />
</g>

</svg>