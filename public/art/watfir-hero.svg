<title id="title">Watfir — monument et bandes</title>
<desc id="desc">Une bande rouge et une bande cyan montent vers une église à flèche posée sur un pont à trois arches.</desc>
<!-- Coordonnées = pixels de la maquette V4 (941 px de large). -->
<defs>
