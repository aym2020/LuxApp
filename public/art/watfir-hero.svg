<svg xmlns="http://www.w3.org/2000/svg" width="400" height="160" viewBox="0 0 400 160" role="img" aria-labelledby="title desc">
<title id="title">Watfir — monument géométrique</title>
<desc id="desc">Deux fines bandes cyan et rouge montent en douceur vers une tour élancée posée sur un pont à trois arches.</desc>
<!-- Bandes : tracées en premier, elles passent derrière la tour et s'arrêtent au bord droit du pont. -->
<g fill="none" stroke-width="7">
<path d="M0 126H168C214 126 220 64 266 64H392" stroke="#02C5E7"/>
<path d="M0 139H163C209 139 215 77 261 77H392" stroke="#F22421"/>
</g>
<g fill="#F7E9C2">
<!-- Pont : tablier fin, trois arches -->
<path d="M228 122H392V160H228z"/>
<!-- Tour : socle évasé, fût, corniche, clocheton, flèche -->
<path d="M290 122L298 113H322L330 122z"/>
<path d="M302 58H318V114H302z"/>
<path d="M298 53H322V59H298z"/>
<path d="M304 35H316V54H304z"/>
<path d="M303 36L310 8L317 36z"/>
<path d="M309.2 2H310.8V10H309.2z"/>
</g>
<g fill="#080808">
<path d="M236 160V152A22 20 0 0 1 280 152V160z"/>
<path d="M288 160V152A22 20 0 0 1 332 152V160z"/>
<path d="M340 160V152A22 20 0 0 1 384 152V160z"/>
</g>
</svg>
