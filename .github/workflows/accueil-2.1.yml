name: LuxApp 2.1 — tests interface

on:
  push:
    branches: ['2.1']
  pull_request:
    branches: ['2.1']

jobs:
  accueil:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test du rendu et des liens de l'accueil
        run: node --test test/accueil-v21.test.cjs test/exercices-v21.test.cjs test/exercices-etats-v21.test.cjs
      - name: Deux textes A1.2 expression écrite — structure et correction
        run: node --test test/expression-ecrite-v21.test.cjs
      - name: SPEC 88 - Jeux et Survie (données, parties, accueil)
        run: node --test test/jeux-v21.test.cjs test/survie-vfx.test.cjs
      - name: Tests du moteur de session et des corrections
        run: node tests/test_session_erreurs_frequentes.js && node tests/test_session_feedback_visible.js
