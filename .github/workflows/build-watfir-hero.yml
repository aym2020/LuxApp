name: Validate Watfir hero (dev)

on:
  push:
    branches: [dev]
    paths:
      - 'public/art/watfir-hero-background-*.webp'
      - 'docs/brand/watfir-hero-reference-fhd.webp'
      - 'public/watfir-dev.css'
      - 'public/watfir-dev.js'
      - '.github/workflows/build-watfir-hero.yml'
      - 'test/watfir-dev.test.cjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hero:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Image dependency
        run: python -m pip install pillow
      - name: Verify checked-in illustrated assets without changing them
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          expected = {
              'public/art/watfir-hero-background-fhd.webp': ((1920, 1080), 250000),
              'public/art/watfir-hero-background-mobile.webp': ((960, 540), 100000),
              'docs/brand/watfir-hero-reference-fhd.webp': ((1920, 1080), 300000),
          }
          for name, (size, maximum) in expected.items():
              file = Path(name)
              assert file.is_file(), name
              assert file.stat().st_size < maximum, (name, file.stat().st_size)
              with Image.open(file) as img:
                  assert img.size == size, (name, img.size)
                  assert img.format == 'WEBP', name
              print(name, file.stat().st_size)
          PY
      - name: Test Watfir integration and existing home UI
        run: node --test test/accueil-v21.test.cjs test/watfir-dev.test.cjs
