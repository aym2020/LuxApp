name: Survie — sortie cinématique mobile
on:
  push:
    branches: ['2.1']
    paths:
      - 'public/jeux-v21.js'
      - 'public/jeux-v21.css'
      - 'public/survie-vfx.js'
      - 'tests/test_survie_fin_mobile.py'
      - '.github/workflows/survie-fin-mobile.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sortie-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright==1.56.0
      - run: python -m playwright install --with-deps chromium
      - name: Vérifier rideau, score, reprise et petits écrans
        run: python tests/test_survie_fin_mobile.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: survie-fin-mobile-${{ github.run_id }}
          path: survie-fin-screenshots/
          if-no-files-found: ignore
          retention-days: 14
