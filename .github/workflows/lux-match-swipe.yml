name: Lux Match — SPEC 111 swipe UI mobile
on:
  push:
    branches: ['2.1']
    paths:
      - 'public/lux-match.js'
      - 'public/lux-match.css'
      - 'public/index.html'
      - 'tests/test_lux_match_swipe_ui.py'
      - 'tests/test_lux_match_swipe.py'
      - 'tests/capture_lux_match_swipe_spec111.py'
      - 'test/lux-match-swipe-ui.test.cjs'
      - '.github/workflows/lux-match-swipe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  swipe:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installer le serveur et Chromium
        run: |
          npm ci --no-audit --no-fund
          python -m pip install 'playwright==1.56.0'
          python -m playwright install --with-deps chromium
      - name: Validation syntaxique, statique et moteur
        run: |
          node --check public/lux-match.js
          node --test test/lux-match-swipe-ui.test.cjs test/lux-match.test.cjs test/lux-match-contenus.test.cjs test/lux-match-conversation.test.cjs test/lux-match-generateur.test.cjs test/lux-match-narratif.test.cjs
      - name: Démarrer la recette sans activer le jeu public
        run: |
          LUX_TESTS=1 PORT=3456 node server.js >/tmp/lux-match-swipe.log 2>&1 &
          for n in $(seq 1 50); do
            if curl -fsS http://127.0.0.1:3456/config.js | grep -q 'APP_CONFIG.TESTS = true'; then break; fi
            sleep 0.2
          done
      - name: Gestes pointer/tactiles et états annulés
        run: python tests/test_lux_match_swipe.py
      - name: Recette UI responsive, FR et actions
        run: python tests/test_lux_match_swipe_ui.py
      - name: Captures avant/après au vrai format mobile
        run: python tests/capture_lux_match_swipe_spec111.py
      - name: Joindre les captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lux-match-swipe-spec111
          path: artifacts/lux-match-swipe/
          if-no-files-found: warn
          retention-days: 30
      - name: Journal serveur en cas d'échec
        if: failure()
        run: tail -100 /tmp/lux-match-swipe.log
