name: Mot caché — Valider Android
on:
  push:
    branches: ['2.1']
    paths:
      - 'public/exercices-v21.css'
      - 'public/index.html'
      - 'public/parcours.js'
      - 'tests/test_motcache_cta_mobile.py'
      - '.github/workflows/motcache-cta-mobile.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  motcache-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: python -m pip install playwright==1.56.0
      - run: python -m playwright install --with-deps chromium
      - name: Vérifier Valider 0 à 3 erreurs + tests Mot caché existants
        run: |
          LUX_TESTS=1 PORT=3456 node server.js >/tmp/lux-server.log 2>&1 &
          for i in $(seq 1 50); do curl -sf http://localhost:3456/ >/dev/null && break; sleep .2; done
          python tests/test_motcache_cta_mobile.py
          python tests/test_motcache.py
