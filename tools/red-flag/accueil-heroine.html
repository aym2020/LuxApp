<!doctype html>
<!-- SPEC 115 V2 — rendu HORS LIGNE de l'illustration de l'accueil RED FLAG.
     Servi par tools/red-flag/rendre-accueil.py (Playwright) ; jamais chargé par l'application.
     Héroïne : Casual3_Female (Quaternius, CC0, déjà dans public/lux-match/), teintes propres à RED FLAG.
     Sortie : public/art/redflag-accueil.webp (rendu basse résolution agrandi sans lissage, style PS1). -->
<meta charset="utf-8"><body style="margin:0;background:#000">
<script type="module">
import * as THREE from '/vendor/three/three.module.min.js';
import { GLTFLoader } from '/vendor/three/GLTFLoader.js';
const L = 360, H = 252, ECHELLE = 2;   // rendu 360×252, exporté en 720×504
const charger = n => new GLTFLoader().loadAsync('/lux-match/' + n + '.glb?v=1');
const [anims, gltf] = await Promise.all([charger('anims'), charger('Casual3_Female')]);
const mat = c => new THREE.MeshLambertMaterial({ color: c, flatShading: true });
const lueur = c => new THREE.MeshBasicMaterial({ color: c, toneMapped: false });
const boite = (l, h, p, c, x, y, z) => { const m = new THREE.Mesh(new THREE.BoxGeometry(l, h, p), c.isMaterial ? c : mat(c)); m.position.set(x, y, z); return m; };
const cyl = (r, h, c, x, y, z, f) => { const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, h, f || 10), c.isMaterial ? c : mat(c)); m.position.set(x, y, z); return m; };

const scene = new THREE.Scene();
scene.background = new THREE.Color('#140e1d');
scene.add(new THREE.HemisphereLight(0xa48cff, 0x1a1024, 1.75));
const lampe = new THREE.PointLight(0xffb070, 2.6, 4, 1.6); lampe.position.set(0.95, 1.3, -0.55); scene.add(lampe);
const ecranLum = new THREE.PointLight(0xff6fe0, 0.35, 0.7, 2); ecranLum.position.set(0.2, 1.0, 0.45); scene.add(ecranLum);
const fil = new THREE.DirectionalLight(0x8a7cff, 1.3); fil.position.set(-2, 2.5, 1.5); scene.add(fil);
// Chambre de nuit : mur, fenêtre et lune, table de nuit, lampe, tasse.
const sol = new THREE.Mesh(new THREE.PlaneGeometry(12, 12), mat('#22182e')); sol.rotation.x = -Math.PI / 2; scene.add(sol);
scene.add(boite(10, 3.4, 0.1, '#2e2140', 0, 1.7, -1.4));
scene.add(boite(1.2, 0.95, 0.04, '#171126', -0.95, 1.85, -1.33), boite(1.02, 0.78, 0.02, lueur('#1c2a5a'), -0.95, 1.85, -1.3));
const lune = new THREE.Mesh(new THREE.CircleGeometry(0.11, 12), lueur('#f3e3b0')); lune.position.set(-0.7, 2.05, -1.28); scene.add(lune);
scene.add(boite(0.7, 0.05, 0.5, '#6e4a33', 1.0, 0.72, -0.5));
[[0.7, -0.3], [1.3, -0.3], [0.7, -0.7], [1.3, -0.7]].forEach(([x, z]) => scene.add(boite(0.05, 0.7, 0.05, '#4e3324', x, 0.35, z)));
scene.add(cyl(0.06, 0.04, '#2a2030', 1.15, 0.765, -0.62), cyl(0.014, 0.3, '#2a2030', 1.15, 0.93, -0.62, 6));
const abat = new THREE.Mesh(new THREE.ConeGeometry(0.15, 0.17, 10, 1, true), lueur('#ffcf8a')); abat.position.set(1.15, 1.13, -0.62); scene.add(abat);
scene.add(cyl(0.05, 0.09, '#e9dcf2', 0.86, 0.79, -0.4, 10), cyl(0.04, 0.005, '#5a3324', 0.86, 0.835, -0.4, 10)); // tasse

// Héroïne : matériaux mats recolorés, pose Idle figée, bras droit levé vers le téléphone.
const perso = gltf.scene;
const TEINTES = { Skin: '#d7a07a', Hair: '#7a3424', Shirt: '#7a3fc4', Pants: '#22202e' };
perso.traverse(o => {
  if (!o.isMesh) return;
  o.material = [].concat(o.material).map(m => { const n = mat(m.color.clone()); const nom = m.name.replace(/\.\d+$/, ''); if (TEINTES[nom]) n.color.set(TEINTES[nom]); return n; });
  if (o.material.length === 1) o.material = o.material[0];
  o.frustumCulled = false;
});
const boiteP = new THREE.Box3().setFromObject(perso); perso.scale.setScalar(1.72 / (boiteP.max.y - boiteP.min.y));
perso.position.set(0.05, 0, 0); perso.rotation.y = 0.55;
scene.add(perso);
const mixer = new THREE.AnimationMixer(perso);
const idle = anims.animations.find(a => a.name === 'Idle');
mixer.clipAction(idle).play(); mixer.setTime(0.4);
// GLTFLoader retire les points des noms d'os : « UpperArm.R » devient « UpperArmR ».
const os = {}; perso.traverse(o => { if (o.isBone) os[o.name] = o; });
const P = window.POSE || { epaule: [0, 0, 0.4], coude: [1.9, 0, 0.3], tete: [-0.35, -0.2, 0.05] };
const tourner = (nom, r) => { const b = os[nom]; if (b) { b.rotation.x += r[0]; b.rotation.y += r[1]; b.rotation.z += r[2]; } };
tourner('UpperArmR', P.epaule); tourner('LowerArmR', P.coude); tourner('Head', P.tete);
// Téléphone tenu dans la main droite, écran rose allumé.
const tel = new THREE.Group();
tel.add(boite(0.075, 0.15, 0.012, '#0c0912', 0, 0, 0));
tel.add(boite(0.064, 0.13, 0.002, lueur('#ff7fe6'), 0, 0, 0.0075));
tel.add(boite(0.05, 0.02, 0.002, lueur('#ffffff'), 0, 0.045, 0.0085)); // notification Cringr
tel.scale.setScalar(window.TEL_ECHELLE || 1.5); // stylisé : lisible dans une petite image
// Le téléphone est posé dans la main (position du poing après la pose), écran tourné
// entre son visage et la caméra : on le reconnaît, et sa lueur éclaire l'héroïne.
perso.updateMatrixWorld(true);
const poing = new THREE.Vector3(), tete = new THREE.Vector3();
os['FistR'].getWorldPosition(poing); os['Head'].getWorldPosition(tete);
tel.position.copy(poing).add(new THREE.Vector3(...(window.TEL_DECALAGE || [0.04, 0.1, 0.08])));
scene.add(tel);
const cam = new THREE.PerspectiveCamera(30, L / H, 0.05, 30);
cam.position.set(...(window.CAM || [1.95, 1.45, 2.45])); cam.lookAt(...(window.VISEE || [0.42, 1.12, -0.3]));
const viseeTel = tete.clone().lerp(cam.position, window.TEL_VERS || 0.55); tel.lookAt(viseeTel);
ecranLum.position.copy(tel.position).add(new THREE.Vector3(0, 0.05, 0.12));

const canvas = document.createElement('canvas');
const r = new THREE.WebGLRenderer({ canvas, antialias: false, preserveDrawingBuffer: true });
r.outputColorSpace = THREE.SRGBColorSpace; r.toneMapping = THREE.NeutralToneMapping;
r.setPixelRatio(1); r.setSize(L, H, false); r.render(scene, cam);
const grand = document.createElement('canvas'); grand.width = L * ECHELLE; grand.height = H * ECHELLE;
const g = grand.getContext('2d'); g.imageSmoothingEnabled = false; g.drawImage(canvas, 0, 0, grand.width, grand.height);
document.body.appendChild(grand);
window.RESULTAT = grand.toDataURL('image/webp', 0.86);
</script>
