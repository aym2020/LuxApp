      <linearGradient id="ruban-cyan" x1="0" y1="0" x2="1" y2=".75"><stop offset="0" stop-color="#02C5E7"/><stop offset="1" stop-color="#009FBE"/></linearGradient>
    </defs>
    <path id="rouge-arriere" d="M20 319 C82 321 110 251 157 214 C225 165 319 151 393 166 C452 180 478 209 466 262 C458 241 438 223 398 223 C290 220 226 275 164 335 C105 392 52 380 20 371Z" fill="url(#ruban-rouge)"/>
    <path d="M382 220 C438 216 463 240 466 262 C462 287 452 292 445 295 C446 263 424 244 396 247Z" fill="#A51B22" opacity=".85"/>
