<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 560" role="img" aria-labelledby="title desc">
<title id="title">Watfir — proposition 2, arches corrigées</title>
<desc id="desc">Icône noire arrondie au bord crème avec la tour, trois arches régulières et les rubans rouge et cyan.</desc>
<rect x="17" y="17" width="526" height="526" rx="111" fill="#050505" stroke="#F7E9C2" stroke-width="10"/>
