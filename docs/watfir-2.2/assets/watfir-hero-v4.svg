<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 864 265" width="864" height="265" role="img" aria-labelledby="title desc">
  <title id="title">Watfir — rubans rétro, tour et pont</title>
  <desc id="desc">Deux bandes continues, rouge et cyan, s'entrecroisent en une courbe fluide derrière le monument de l'icône : tour à flèche et pont à trois arches régulières.</desc>
  <!-- Révision V5 : monument repris de l'icône de l'app (flèche, tour, toiture), trois arches identiques. Gabarit 864 × 265, fond transparent. -->
  <g id="rubans" fill="none" stroke-linecap="butt" stroke-linejoin="round">
    <!-- Rouge : ligne supérieure à gauche, inférieure à droite (au niveau des fenêtres). -->
    <path id="ruban-rouge-detourage" d="M 46,225 H 390 C 444,225 476,185 517,163 C 541,149 566,141 598,141 H 833" stroke="#080808" stroke-width="23"/>
    <path id="ruban-rouge" d="M 46,225 H 390 C 444,225 476,185 517,163 C 541,149 566,141 598,141 H 833" stroke="#F22421" stroke-width="18"/>
    <!-- Cyan : ligne inférieure à gauche, supérieure à droite ; passage au-dessus du rouge. -->
    <path id="ruban-cyan-detourage" d="M 40,248 H 425 C 465,248 497,190 535,145 C 553,124 576,112 602,112 H 833" stroke="#080808" stroke-width="23"/>
    <path id="ruban-cyan" d="M 40,248 H 425 C 465,248 497,190 535,145 C 553,124 576,112 602,112 H 833" stroke="#02C5E7" stroke-width="18"/>
  </g>
  <g id="monument" stroke-linejoin="round">
    <!-- Toiture, tour et flèche : liseré sombre qui sépare la pierre des rubans. -->
    <path id="silhouette-detourage" d="M 603.5,199.3 L 616.2,189.1 H 634.3 L 652.4,178.6 H 697 V 129.1 Q 697,124.7 701.5,121 L 705.6,117.3 L 707.8,104.4 L 714.5,95.9 L 717,67.8 L 715.4,62 Q 714.5,58.6 716.4,55.5 L 720.8,49.1 L 725.9,3 L 730.6,49.1 L 735.1,55.5 Q 737.6,58.9 735.4,62.7 L 733.5,67.8 L 737,96.6 L 744.3,105 L 746.8,117.6 L 751.6,121 Q 755.4,124.4 755.4,129.1 V 178.6 H 798.8 L 822.6,199.3 Z" fill="none" stroke="#080808" stroke-width="8"/>
    <path id="silhouette-ivoire" d="M 603.5,199.3 L 616.2,189.1 H 634.3 L 652.4,178.6 H 697 V 129.1 Q 697,124.7 701.5,121 L 705.6,117.3 L 707.8,104.4 L 714.5,95.9 L 717,67.8 L 715.4,62 Q 714.5,58.6 716.4,55.5 L 720.8,49.1 L 725.9,3 L 730.6,49.1 L 735.1,55.5 Q 737.6,58.9 735.4,62.7 L 733.5,67.8 L 737,96.6 L 744.3,105 L 746.8,117.6 L 751.6,121 Q 755.4,124.4 755.4,129.1 V 178.6 H 798.8 L 822.6,199.3 Z" fill="#F7E9C2"/>
    <!-- Trois fenêtres pleines (noir du fond) : les rubans ne transparaissent pas. -->
    <path id="fenetres" d="M 708.8,137.6 H 716.1 V 155.9 H 708.8 Z M 723,137.6 H 730.3 V 155.9 H 723 Z M 737.3,137.6 H 744.6 V 155.9 H 737.3 Z" fill="#080808"/>
    <!-- Pont : trois arches de même largeur, piles régulières. -->
    <path id="pont-detourage" d="M 541.4,261 L 565.5,228.5 Q 584.5,208.5 605.4,208.5 H 827 V 261 H 808.3 V 255.9 C 808.3,237.9 795.6,226.4 777.7,226.4 C 759.8,226.4 747.1,237.9 747.1,255.9 V 261 H 727.5 V 255.9 C 727.5,237.9 714.8,226.4 696.9,226.4 C 679,226.4 666.3,237.9 666.3,255.9 V 261 H 646.6 V 255.9 C 646.6,237.9 634,226.4 616.1,226.4 C 598.2,226.4 585.5,237.9 585.5,255.9 V 261 Z" fill="none" stroke="#080808" stroke-width="7"/>
    <path id="pont-ivoire" d="M 541.4,261 L 565.5,228.5 Q 584.5,208.5 605.4,208.5 H 827 V 261 H 808.3 V 255.9 C 808.3,237.9 795.6,226.4 777.7,226.4 C 759.8,226.4 747.1,237.9 747.1,255.9 V 261 H 727.5 V 255.9 C 727.5,237.9 714.8,226.4 696.9,226.4 C 679,226.4 666.3,237.9 666.3,255.9 V 261 H 646.6 V 255.9 C 646.6,237.9 634,226.4 616.1,226.4 C 598.2,226.4 585.5,237.9 585.5,255.9 V 261 Z" fill="#F7E9C2"/>
  </g>
</svg>
