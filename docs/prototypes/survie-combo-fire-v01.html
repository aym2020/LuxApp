<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LuxApp — Prototype Embrasement Canvas V0.1 (hors application)</title>
<style>
:root{color-scheme:dark;--gold:#f5cf4d}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#0f0e0c;color:#f5efe4;font-family:Inter,system-ui,-apple-system,sans-serif;display:grid;place-items:center;padding:12px}
.demo{width:min(100%,470px);padding:20px 16px 25px;border:1px solid #3c2c21;border-radius:22px;overflow:hidden;background:radial-gradient(ellipse at 50% -10%,#31221a,#16120f 54%,#0f0e0c 92%)}
.head{display:flex;justify-content:space-between;align-items:center;color:#b8aa9a;font-size:10px;font-weight:800;letter-spacing:.16em;margin-bottom:24px}
.brand{font-family:Georgia,serif;color:#f5efe4;font-weight:800;font-size:24px;letter-spacing:-.055em}
.brand b{color:#f5cf4d;font-weight:800}
.top{display:flex;align-items:end;justify-content:space-between;gap:12px;margin-bottom:18px}
.kicker{font:800 10px/1.4 system-ui;letter-spacing:.17em;color:#b3a799}
h1{font:400 clamp(34px,10vw,44px)/1.14 Georgia,serif;letter-spacing:-.065em;margin:5px 0 0}
h1 em{font-style:normal;color:#f5cf4d}
.streak{text-align:right;white-space:nowrap}
.streak strong{display:block;color:#f9d174;font:900 42px/1 system-ui;letter-spacing:-.06em;font-variant-numeric:tabular-nums}
.streak small{color:#ad9e8e;letter-spacing:.15em;font-size:10px}
.stage{position:relative;height:245px;isolation:isolate;overflow:hidden;border-radius:14px;border:1px solid #58402e;background:radial-gradient(ellipse at 50% 85%,#25170f,#0d0b0c 70%)}
.stage::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 7px,#ffffff03 8px);pointer-events:none;z-index:3}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;z-index:2;pointer-events:none}
.stagehead,.stagefoot{position:absolute;left:18px;right:18px;display:flex;justify-content:space-between;gap:12px;align-items:center;z-index:4;color:#b4a596;font:800 10px/1.3 system-ui;letter-spacing:.12em}
.stagehead{top:19px}.stagefoot{bottom:18px}
.stagehead b,.stagefoot b{color:#efc883}
.rail{position:absolute;left:21px;right:21px;bottom:56px;height:14px;border:1px solid #5b4734;border-radius:9px;background:#24201c;z-index:1;box-shadow:inset 0 2px 5px #070605}
.rail .mark{position:absolute;width:1px;top:0;bottom:0;background:#8c6e4977}
.fill{position:absolute;left:0;top:0;bottom:0;border-radius:9px;background:linear-gradient(180deg,#fff2c0,#f6cb64 35%,#e99c3c 67%,#a34a22 100%);box-shadow:0 0 12px #d9854777}
.fill::after{content:"";position:absolute;right:-3px;top:-4px;bottom:-4px;width:6px;border-radius:80%;background:#ffefc5;box-shadow:0 0 12px 5px #ffbb55,0 0 24px 7px #df763e77}
.flash{position:absolute;top:68px;right:21px;z-index:5;pointer-events:none;font-size:13px;font-weight:900;color:#ffde93;opacity:0}
.flash.show{animation:float .56s ease-out both}
@keyframes float{0%{opacity:0;transform:translateY(7px)}20%{opacity:1}80%{opacity:1}100%{opacity:0;transform:translateY(-24px)}}
.control{display:flex;align-items:center;gap:12px;margin:17px 0 10px}
.control label{color:#b8a997;letter-spacing:.11em;font-size:10px;font-weight:800}
.control input{flex:1;min-width:0;width:100%;accent-color:#f5cf4d}
.control output{color:#e4d1b3;min-width:47px;font-size:11px;font-weight:850;text-align:right}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.actions button{min-height:48px;border-radius:10px;font:800 13px system-ui;cursor:pointer;touch-action:manipulation}
.win{color:#24190c;background:#f5cf4d;border:1px solid #ffe18a}
.lose{color:#dfb4a0;background:#261b18;border:1px solid #67504b}
.actions button:active{transform:scale(.975)}button:focus-visible,input:focus-visible{outline:2px solid #fff0bb;outline-offset:3px}
.note{color:#a89a8a;font:500 11px/1.45 system-ui;text-align:center;margin:15px 0 0}
@media(max-width:360px){.demo{padding:15px 11px 20px}.stage{height:220px}.stagehead,.stagefoot{left:12px;right:12px}.rail{left:14px;right:14px}}
@media(prefers-reduced-motion:reduce){.flash.show{animation:none}}
</style>
</head>
<body>
<main class="demo">
  <div class="head"><span class="brand">Lux<b>App.</b></span><span>ARCADE / SURVIE · TEST</span></div>
  <div class="top">
    <div><span class="kicker">ÉNERGIE COMBO</span><h1>Embrasement<em>.</em></h1></div>
    <div class="streak"><strong id="streak">12</strong><small>STREAK</small></div>
  </div>
  <section class="stage" id="stage" aria-label="Prévisualisation de la jauge enflammée">
    <div class="stagehead"><span>CHARGE DE PUISSANCE</span><b id="tier">BRASIER · ×2</b></div>
    <div class="rail" id="rail">
      <i class="mark" style="left:25%"></i><i class="mark" style="left:50%"></i><i class="mark" style="left:75%"></i>
      <div class="fill" id="fill" style="width:60%"></div>
    </div>
    <canvas id="vfx" aria-hidden="true"></canvas>
    <div class="flash" id="flash">+1 COMBO</div>
    <div class="stagefoot"><span>ÉNERGIE CINÉTIQUE</span><b id="energy">60 %</b></div>
  </section>
  <div class="control"><label for="power">INTENSITÉ</label><input type="range" id="power" min="0" max="24" value="12"><output id="value" for="power">12 / 24</output></div>
  <div class="actions"><button class="win" type="button" id="win">+ Réussite</button><button class="lose" type="button" id="lose">Rupture de combo</button></div>
  <p class="note">Prototype autonome : aucune modification du moteur de jeu ou des scores de LuxApp.</p>
</main>
<script>
'use strict';
(()=>{
const $=id=>document.getElementById(id),canvas=$('vfx'),ctx=canvas.getContext('2d',{alpha:true});
const stage=$('stage'),rail=$('rail'),fill=$('fill'),slider=$('power'),flash=$('flash');
const reduced=window.matchMedia('(prefers-reduced-motion:reduce)').matches;
let value=12,progress=.6,width=0,height=0,dpr=1,particles=[],sparks=[],burst=0,breakup=0,t=0,last=0,visible=!document.hidden,raf=0;
const random=(a,b)=>a+Math.random()*(b-a);
function resize(){const r=stage.getBoundingClientRect();width=r.width;height=r.height;
 dpr=Math.min(1.7,window.devicePixelRatio||1);
 canvas.width=Math.max(1,Math.round(width*dpr));canvas.height=Math.max(1,Math.round(height*dpr));
 ctx.setTransform(dpr,0,0,dpr,0,0);}
function position(){const a=rail.getBoundingClientRect(),b=stage.getBoundingClientRect();
 return {x:a.left-b.left+1,w:a.width-2,y:a.top-b.top+1};}
function tier(n){return n>=20?'INFERNO · ×3':n>=15?'SURCHAUFFE · ×3':n>=10?'BRASIER · ×2':n>=5?'IGNITION · ×1.5':'CHARGE · ×1';}
function ui(){slider.value=String(value);$('streak').textContent=String(value);
 $('value').textContent=value+' / 24';$('energy').textContent=Math.round(Math.min(1,value/20)*100)+' %';
 $('tier').textContent=tier(value);
 if(reduced){progress=Math.min(1,value/20);fill.style.width=progress*100+'%';}}
function flashText(txt){flash.textContent=txt;flash.classList.remove('show');void flash.offsetWidth;flash.classList.add('show');}
function setValue(n,kind){const old=value;value=Math.min(24,Math.max(0,n));ui();
 if(kind==='up'&&value>old){burst=1;flashText('+1 COMBO');}
 if(kind==='break'){breakup=1;flashText('COMBO BRISÉ');}}
function particle(x,y,heat,kind='ember'){
 const hot=Math.random()>.61;
 return {x,y,vx:random(-120,-5)*(heat+.35),vy:random(-96,-13)*(heat+.4),age:0,
  life:random(.3,.94),r:random(.8,hot?4.7:2.6),hot,kind};
}
function radial(x,y,r,opacity){
 const g=ctx.createRadialGradient(x,y,0,x,y,r);
 g.addColorStop(0,'rgba(255,254,230,'+(opacity*.9)+')');
 g.addColorStop(.16,'rgba(255,210,122,'+(opacity*.55)+')');
 g.addColorStop(.43,'rgba(253,122,40,'+(opacity*.27)+')');
 g.addColorStop(1,'rgba(255,100,40,0)');
 ctx.fillStyle=g;ctx.fillRect(x-r,y-r,r*2,r*2);
}
function spawnBurst(x,y,fracture=false){
 for(let i=0;i<7;i++){let p=particle(x+random(-7,7),y+random(-4,4),1.4,'spark');
 p.vx=fracture?random(-140,130):random(-180,50);
 p.vy=fracture?random(-110,25):random(-170,0);
 p.life=random(.25,.75);sparks.push(p);}
}
function flames(p,heat){
 const end=p.x+p.w*progress,base=p.y+4,range=end-p.x;
 if(range<=2||heat<.02)return;
 ctx.save();ctx.globalCompositeOperation='lighter';
 const amp=12+heat*23,steps=Math.max(12,Math.ceil(range/5));
 for(let layer=0;layer<3;layer++){
  ctx.beginPath();ctx.moveTo(p.x,base+5);
  for(let i=0;i<=steps;i++){
   const u=i/steps,x=p.x+u*range,envelope=Math.pow(Math.sin(Math.PI*u),.35);
   const flicker=Math.abs(Math.sin(u*32+t*(3.6+layer)+layer*1.6)*Math.cos(u*11-t*2.5));
   const len=envelope*(.38+flicker*.6)*(amp-layer*3.5);
   ctx.lineTo(x-(1-u)*(8+layer*2),base-len);
  }
  ctx.lineTo(end,base+5);ctx.closePath();
  const gradient=ctx.createLinearGradient(0,base-amp,0,base+8);
  if(layer===0){gradient.addColorStop(0,'rgba(246,99,30,0)');gradient.addColorStop(.5,'rgba(241,108,29,.11)');gradient.addColorStop(1,'rgba(255,157,55,.27)');}
  else if(layer===1){gradient.addColorStop(0,'rgba(255,179,65,0)');gradient.addColorStop(.58,'rgba(255,164,55,.20)');gradient.addColorStop(1,'rgba(255,209,95,.3)');}
  else{gradient.addColorStop(0,'rgba(255,236,144,0)');gradient.addColorStop(.78,'rgba(255,216,106,.16)');gradient.addColorStop(1,'rgba(255,247,192,.25)');}
  ctx.fillStyle=gradient;ctx.fill();
 }
 const count=Math.floor(range/18);
 for(let i=0;i<count;i++){
  const x=p.x+(i+.5)*range/count,len=(9+heat*16)*(.45+.55*Math.sin(t*4+i*2.3));
  ctx.beginPath();ctx.moveTo(x-5,base+2);
  ctx.quadraticCurveTo(x-10,base-len*.35,x-12-len*.22,base-len);
  ctx.quadraticCurveTo(x+1,base-len*.64,x+6,base+2);ctx.closePath();
  const grad=ctx.createLinearGradient(x,base-len,x,base+2);
  grad.addColorStop(0,'rgba(255,229,118,0)');
  grad.addColorStop(.5,'rgba(253,162,46,.22)');
  grad.addColorStop(1,'rgba(255,229,134,.37)');
  ctx.fillStyle=grad;ctx.fill();
 }
 ctx.restore();
 radial(end,p.y+2,25+burst*20,.52+heat*.37+burst*.25);
 radial(end,p.y+2,8+burst*4,.83);
}
function frame(now){
 raf=window.requestAnimationFrame(frame);
 if(!visible){last=now;return;}
 const dt=Math.min(.04,Math.max(0,(now-(last||now))/1000));last=now;t+=dt;
 const target=Math.min(1,value/20);
 progress+=(target-progress)*Math.min(1,dt*(breakup>.03?11:5));
 if(Math.abs(target-progress)<.0006)progress=target;
 fill.style.width=(progress*100).toFixed(2)+'%';
 ctx.clearRect(0,0,width,height);
 const p=position(),head=p.x+p.w*progress,heat=Math.min(1,(value/20)*1.25);
 if(burst>.75)spawnBurst(head,p.y);
 if(breakup>.75)spawnBurst(head,p.y,true);
 burst=Math.max(0,burst-dt*2.7);breakup=Math.max(0,breakup-dt*2.5);
 const rate=(8+heat*65)*dt;
 if(heat>.05&&progress>.02)for(let i=0;i<Math.floor(rate)+(Math.random()<rate%1?1:0);i++){
  const x=p.x+Math.pow(Math.random(),.55)*p.w*progress;
  particles.push(particle(x,p.y+random(-2,7),heat));
 }
 ctx.save();ctx.globalCompositeOperation='lighter';
 for(const group of [particles,sparks])for(let i=group.length-1;i>=0;i--){
  const q=group[i];q.age+=dt;if(q.age>=q.life){group.splice(i,1);continue;}
  q.x+=q.vx*dt;q.y+=q.vy*dt;if(breakup>.4)q.vy+=dt*170;
  const life=1-q.age/q.life,alpha=Math.pow(life,1.35);
  if(q.hot&&q.r>2.8)radial(q.x,q.y,q.r*3,alpha*.65);
  ctx.beginPath();ctx.arc(q.x,q.y,q.r*(.5+.5*life),0,Math.PI*2);
  ctx.fillStyle=q.hot?'rgba(255,248,189,'+alpha+')':'rgba(255,138,43,'+(alpha*.7)+')';ctx.fill();
 }
 ctx.restore();flames(p,heat);
 if(particles.length>140)particles.splice(0,particles.length-140);
 if(sparks.length>70)sparks.splice(0,sparks.length-70);
}
slider.addEventListener('input',()=>setValue(Number(slider.value),'slider'));
$('win').addEventListener('click',()=>setValue(value+1,'up'));
$('lose').addEventListener('click',()=>setValue(0,'break'));
document.addEventListener('visibilitychange',()=>{visible=!document.hidden;last=0;});
if('ResizeObserver' in window)new ResizeObserver(resize).observe(stage);
else window.addEventListener('resize',resize);
resize();ui();
if(!reduced&&ctx)raf=window.requestAnimationFrame(frame);
})();
</script>
</body>
</html>
